# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pkgsight

# No `go mod tidy` hook: the binary must be built from the tree the tag names.
# CI fails on an untidy go.mod or go.sum instead.
before:
  hooks:
    # The web UI is embedded with go:embed, so web/dist must be built before
    # any Go build. It is the same for every platform, so it is built once.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  # Pure Go, no CGO, so every platform cross-compiles from one runner.
  - id: pkgsight
    main: ./cmd/pkgsight
    binary: pkgsight
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # pkgsight version answers with the release, and MCP reports it.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mpyw
    name: pkgsight
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
