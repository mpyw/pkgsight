packages:
  github.com/mpyw/pkgsight/cmd/pkgsight:
    summary: pkgsight コマンド。serve と notes check
    doc: |-
      pkgsight コマンドは、Go のコードベースの構造をブラウザに描く。

      ```
      pkgsight serve [options] [packages]         地図をブラウザで
      pkgsight notes check [options] [packages]   もう合わない注釈
      ```
    body: |-
      urfave/cli v3 で組み、`main.go` がコマンドを束ね、各コマンドが自分のファイルを持つ。`utils.go` はコマンド間で共有する部品をまとめた declscope の core。

      > [!NOTE]
      > エラーの表示と終了コードは `runMain` が一手に決める。使い方の誤りは 2、`notes check` の失敗は 1。
    fingerprint: 3d89e85b31340451
  github.com/mpyw/pkgsight/internal/callgraph:
    summary: 自前のパッケージのコールグラフ（どの関数がどれを呼ぶか）を作る
    doc: |-
      Package callgraph は、自前のパッケージのコールグラフを作る。

      自前のパッケージはソースから、依存先は型情報だけから読む。すべてを読む場合の 6 分の 1 のメモリで済む。依存先を通る値は呼び出し先を VTA から隠すので、自前の呼び出し先が見つからない interface 呼び出しはクラス階層（CHA）にフォールバックし、結果に Maybe の印を付ける。
    body: |-
      このパッケージに出てくる用語。

      | 用語 | 意味 |
      | --- | --- |
      | SSA | Go のコードを、コンパイラが扱うような単純な命令の並びに直したもの。どの命令がどの関数を呼ぶかを、機械的にたどれる |
      | VTA | 変数や interface にどの型の値が流れ込むかを追って、interface や関数値の呼び出し先を絞り込む方法。正確だが、追える範囲の値しか分からない |
      | CHA | 「そのメソッドを持つ型すべて」を呼び出し先の候補にする大ざっぱな方法。値の流れは見ない |

      依存パッケージはソースを読まず、型情報だけを読む（浅い解析）。全部を読むと cmd/go で 1.17 GB、浅い解析なら 180 MB だった。その代わり、依存パッケージを通る値は VTA で追えなくなり、cmd/go では自前の関数同士の呼び出しが 811 本見えなくなった（うち 724 本は `error` 経由）。これを 2 つの仕組みで補う。

      - VTA で呼び出し先が見つからない interface 呼び出しは、CHA で候補を挙げ、「推測」の印（`Maybe`）を付ける。
      - ライブラリに渡した自前の関数は、ライブラリが呼ぶものとして、`Through` 付きで記録する。

      > [!WARNING]
      > 関数 ID（`builder.id`）は注釈の保存キー。形式を変えると、保存済みの注釈がすべて行き場を失う。
    fingerprint: aeb0b36a13f050c7
  github.com/mpyw/pkgsight/internal/freshness:
    summary: 注釈がまだ今のコードを説明しているか判定する
    doc: |-
      Package freshness は、注釈が書かれたときのコードをまだ説明しているかを判定する。

      注釈は、書かれたときのコードの指紋を持つ。関数の指紋はその字句のハッシュで、コメント・空行・レイアウトは数えない。gofmt やコメントの書き直しでは古くならない。パッケージの指紋は、その doc コメントと関数名のハッシュ。
    body: |-
      状態は 3 つ。

      | 状態 | 意味 |
      | --- | --- |
      | fresh | 指紋がコードと一致する |
      | stale | コードが変わった。または指紋がない |
      | orphan | パッケージや関数が消えた、または改名された |

      画面（`/api/notes` の `stale`）、MCP の `stale_notes`、CLI の `notes check` がこの判定を共有している。

      > [!WARNING]
      > 指紋の計算方法を変えると、すべての注釈が一斉に stale になる。ファイル形式の変更として扱う。
    fingerprint: ef61556606c3f525
  github.com/mpyw/pkgsight/internal/load:
    summary: go list でパッケージグラフを作る
    doc: load パッケージは go list でパッケージグラフを作る。
    body: |-
      地図はこれだけで描ける。型チェックも、コードを命令に直す処理も要らないので、大きなモジュールでもすぐに出せる。コールグラフは別に `internal/callgraph` で作る。

      `Packages` は、パターンに合うパッケージだけを依存なしで列挙する。`notes check` の報告範囲に使う。
    fingerprint: 2913eef6274ffc56
  github.com/mpyw/pkgsight/internal/mcpserver:
    summary: アシスタントにコードを読ませ、注釈を書かせる MCP
    doc: mcpserver パッケージは、アシスタントが MCP 越しにモジュールを読み、注釈を書けるようにする。注釈はブラウザでコードの隣に出る。
    body: |-
      ツールは読む側（`overview`、`package`、`function`、`search`、`stale_notes`）と書く側（`write_package_note`、`write_function_note`、`delete_notes`）に分かれる。答えは JSON ではなくテキスト。モデルにはそのほうが読みやすい。

      プロンプトは Claude Code のスラッシュコマンドになる。ツールの手順を知らなくても `/mcp__pkgsight__explain_flow main ja` のように頼める。

      注釈には書いた時点のコードの指紋が付く。コードが変わると古い注釈として扱われ、`refresh_notes` で書き直せる。
    fingerprint: c5f8e2fc3534fb65
  github.com/mpyw/pkgsight/internal/model:
    summary: 解析結果として画面に送るデータの形
    doc: model パッケージは、解析が画面に送るデータを定義する。
    body: JSON は `encoding/json/v2` で書く。v2 は nil のスライスを `[]` にするので、画面は `null` を気にしなくてよい。数値と真偽値の省略には `omitzero` を使う（v2 の `omitempty` は 0 と false を省略しない）。`web/src/data/types.ts` がこの形を写している。
    fingerprint: 15b532bc9c5ed08f
  github.com/mpyw/pkgsight/internal/notes:
    summary: 注釈を言語ごとの YAML に保存し、行ノートを置き直す
    doc: |-
      Package notes は、アシスタントがコードベースについて書く説明を保持する。パッケージと関数についての要約と本文、そして行番号を取らずに関数の行の間に置かれる注釈。

      言語ごとに、解析するディレクトリの下の .pkgsight/notes/<lang>.yaml というファイルを持つ。チームが注釈をコミットすれば、どの読み手にも届く。
    body: |-
      行ノートは行番号で覚えない。func の行からのオフセットと行のハッシュで覚え、`Place` で今のソースに置き直す。関数全体が変わったかどうかは、`Note.Fingerprint` を freshness パッケージが判定する。

      書き込みは本のコピーを編集し、一時ファイルと rename で差し替える。書き込みに失敗しても、保持している本とファイルはずれない。
    fingerprint: d7105f23dc54f0d5
  github.com/mpyw/pkgsight/internal/server:
    summary: 画面と MCP に、解析結果と注釈を配る HTTP サーバー
    doc: server パッケージは、パッケージグラフ、コールグラフ、注釈を、それを描くフロントエンドと、MCP 越しのアシスタントに配る。
    body: |-
      パッケージグラフは起動時から持ち、コールグラフは後から `SetCalls` で受け取る。それまでコールグラフが要る API は 503 を返す。コードが変わると、`Reload` が両方を一度に差し替える。

      外に出すものは絞っている。`/api/source` は自分のパッケージのファイルだけ、`/api/asset` はルートの下の画像だけ（`os.Root` で外に出られない）。`/mcp` は別オリジンのページからの書き込みを拒む。

      | ファイル | 中身 |
      | --- | --- |
      | `server.go` | 経路、グラフと状態、ソースと画像、UI |
      | `notes.go` | 注釈の読み出しと、変更の通知（SSE） |
    fingerprint: 73745a7dc2c7b37e
  github.com/mpyw/pkgsight/internal/watch:
    summary: モジュールの Go のコードが変わったことに気づく
    doc: |-
      watch パッケージは、モジュールの Go のコードが変わったことを知らせる。

      OS に通知を頼まず、自分で定期的に確かめる。macOS の通知は見張るファイル 1 つごとにファイル記述子を使うので、大きなモジュールでは足りなくなる。確かめるのは、各パッケージのディレクトリにある Go のファイルの大きさと更新時刻だけ。
    body: fsnotify は採らなかった（AGENTS.md）。macOS の kqueue はファイルごとにファイル記述子を開き、既定の上限は 256 しかない。
    fingerprint: 42d42fc5f2cbd579
  github.com/mpyw/pkgsight/web:
